<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-pastel">
    <div class="container mt-5">

        <div class="card shadow pastel-card mx-auto p-4" style="max-width: 600px;">
            <h2 class="text-center mb-4 soft-heading">My To-Do List</h2>

            <!-- Add Task -->
            <form action="/add" method="POST" class="d-flex mb-4">

                <input type="text" name="task" class="form-control soft-input me-2" 
                       placeholder="Add a new task..." required>

                <select name="priority" class="form-select soft-input me-2" style="max-width:120px;">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

                <button class="btn pastel-btn">+</button>
            </form>

            <!-- Task List -->
            <ul class="list-group soft-list">

                {% for t in tasks %}
                <li class="list-group-item d-flex justify-content-between align-items-center soft-item">

                    <span class="d-flex align-items-center">

                        <!-- Priority Dot -->
                        <span class="priority-dot 
                            {% if t[3] == 'high' %}dot-high
                            {% elif t[3] == 'medium' %}dot-medium
                            {% else %}dot-low
                            {% endif %}">
                        </span>

                        <span class="{% if t[2] == 1 %}completed{% endif %} ms-2">
                            {{ t[1] }}
                        </span>
                    </span>

                    <div>
                        <a href="/complete/{{ t[0] }}" class="btn btn-sm btn-done me-1">✓</a>
                        <a href="/update/{{ t[0] }}" class="btn btn-sm btn-edit me-1">✎</a>
                        <a href="/delete/{{ t[0] }}" class="btn btn-sm btn-delete">✕</a>
                    </div>

                </li>
                {% endfor %}

            </ul>
        </div>

    </div>
</body>
</html>
